<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Learning 2026</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" defer src="./index.ts"></script>
    <script type="module" defer src="/components/BackToIndex.ts"></script>
  </head>
  <body>
    <canvas></canvas>

    <style>
      canvas {
        --bg-color: #000;
        --line-color-1: #666;
        --line-color-2: #333;

        background-color: var(--bg-color);
        background-image:
          linear-gradient(var(--line-color-1) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--line-color-1) 1.5px, transparent 1.5px),
          linear-gradient(var(--line-color-2) 1px, transparent 1px), linear-gradient(90deg, var(--line-color-2) 1px, transparent 1px);
        background-position:
          -1.5px -1.5px,
          -1.5px -1.5px,
          -1px -1px,
          -1px -1px;
        background-size:
          100px 100px,
          100px 100px,
          10px 10px,
          10px 10px;
      }
    </style>
  </body>
</html>
